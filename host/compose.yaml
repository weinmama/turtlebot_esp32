version: "3.8"
services:
  router:
    image: ${PICOROS_HOST_IMAGE:-turtlebox-backend:lyrical}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./router.json5:/config/router.json5:ro
    environment:
      ROS_DOMAIN_ID: "1"
      ZENOH_ROUTER_CONFIG_URI: /config/router.json5
    entrypoint: /ros_entrypoint.sh
    command: [ros2, run, rmw_zenoh_cpp, rmw_zenohd]
  serial:
    image: ${PICOROS_HOST_IMAGE:-turtlebox-backend:lyrical}
    network_mode: host
    restart: unless-stopped
    depends_on: [router]
    devices:
      - ${ESP32_DEVICE:-/dev/esp32}:/dev/esp32
    volumes:
      - ./serial-router.json5:/config/serial-router.json5:ro
      - ./wait-router.sh:/app/wait-router.sh:ro
    environment:
      ROS_DOMAIN_ID: "1"
      ZENOH_ROUTER_CONFIG_URI: /config/serial-router.json5
    entrypoint: /ros_entrypoint.sh
    command: [bash, /app/wait-router.sh, ros2, run, rmw_zenoh_cpp, rmw_zenohd]
  clock:
    image: ${PICOROS_HOST_IMAGE:-turtlebox-backend:lyrical}
    network_mode: host
    restart: unless-stopped
    depends_on: [router]
    volumes:
      - ./time_sync.py:/app/time_sync.py:ro
      - ./wait-router.sh:/app/wait-router.sh:ro
    environment:
      ROS_DOMAIN_ID: "1"
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_CONFIG_OVERRIDE: 'connect/endpoints=["tcp/127.0.0.1:7447"];scouting/multicast/enabled=false'
    entrypoint: /ros_entrypoint.sh
    command: [bash, /app/wait-router.sh, python3, /app/time_sync.py]
